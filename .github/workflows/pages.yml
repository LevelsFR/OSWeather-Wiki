name: Publish OS Weather Wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'web/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osweather-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build public documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public documentation repository only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Markdown renderer
        run: python -m pip install 'mistune==3.2.1'
      - name: Build bilingual static documentation site
        run: python scripts/build_site.py
      - name: Verify public site assets
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/fr-FR/index.html
          test -s _site/api-v1.html
          test -s _site/assets/wiki.css
          test -s _site/assets/wiki.js
          test -s _site/search-index.json
          if grep -rE 'PRIVATE KEY|BEGIN OPENSSH|gh[pousr]_[a-zA-Z0-9]{30}' _site; then
            echo 'Potential secret in the published website'; exit 1
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
